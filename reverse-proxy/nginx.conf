events {}

http {
    server {
        listen 80;
        server_name _;

        # -----------------------------
        # BACKEND API
        # -----------------------------
        location /api/ {
            proxy_pass http://web:5000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -----------------------------
        # GRAFANA UI
        # -----------------------------
        location /monitoring/ {
            proxy_pass http://grafana:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 🔥 CRITICAL for Grafana Live
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # -----------------------------
        # JAEGER UI
        # -----------------------------
        location /jaeger/ {
            proxy_pass http://jaeger:16686;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Grafana prepends its sub-path (/monitoring/) to data-link URLs,
        # so trace links from dashboard panels arrive here. Strip /monitoring
        # and forward to Jaeger, which expects /jaeger/* (QUERY_BASE_PATH).
        location /monitoring/jaeger/ {
            rewrite ^/monitoring(/jaeger/.*)$ $1 break;
            proxy_pass http://jaeger:16686;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}